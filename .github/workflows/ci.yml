name: CI

# Runs the CadenceCore unit tests on every push to main and every pull request.
# Deliberately test-only: building, signing and packaging the app lives in release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # test results check run
  pull-requests: write   # test results PR comment

jobs:
  test:
    name: Unit tests
    # The app uses macOS 26 SDK APIs, so stay on the macOS 26 image (Xcode 26 / Swift 6.2+).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run tests
        run: scripts/test.sh --xunit-output build/junit.xml

      # Docker-free macOS variant of the action: adds a "Unit test results" check and a PR comment.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          files: build/junit.xml
          check_name: Unit test results

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: build/junit.xml
          if-no-files-found: warn
