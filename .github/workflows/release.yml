name: Release

# Release flow: work out the version → test → build Cadence.app → DMG + zip → tag → GitHub release
# → website download links (site-downloads.yml).
#
# Version: the highest major/minor/patch label among PRs merged into main since the last vX.Y.Z tag
# (see scripts/next-version.sh). The first release uses the version in Support/Info.plist.
# Release notes: .github/RELEASE_NOTES_TEMPLATE.md, with the merged-PR changelog grouped by build (the mac / ios /
# website / ci / docs labels), then by release label (scripts/changelog.py). The iPhone build gets only the
# iPhone section, as TestFlight's "What to Test" and as a file to paste into the App Store's "What's New".
#
# Signing and notarization switch on by themselves once these repository secrets exist. Until then the
# app is ad-hoc signed, the DMG is NOT notarized, and the release is marked as a pre-release.
#
#   MACOS_CERTIFICATE_P12        base64 of a "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD   password for that .p12
#   CODESIGN_IDENTITY            e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_TEAM_ID                10-character team ID
#   APPLE_APP_PASSWORD           app-specific password for that Apple ID
#
# Optional, bundled into Info.plist (see Support/Secrets.env.example):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_ID, SLACK_CLIENT_ID
#
# iPhone app → TestFlight (the "ios" job). The job is skipped until the IOS_BUNDLE_ID variable exists (CI
# already checks the Simulator build on every PR). Once it's set, the job uploads when all of the below exist and
# only builds for the Simulator otherwise. It never submits for App Review: do that in App Store Connect.
#   Secrets:
#     IOS_DISTRIBUTION_P12           base64 of an "Apple Distribution" certificate exported as .p12
#     IOS_DISTRIBUTION_P12_PASSWORD  password for that .p12
#     IOS_APP_PROFILE                base64 of the App Store provisioning profile for the app
#     IOS_WIDGET_PROFILE             base64 of the App Store provisioning profile for <bundle id>.widgets
#     ASC_KEY_ID, ASC_ISSUER_ID      App Store Connect API key (role: App Manager) and its issuer ID
#     ASC_KEY_P8                     contents of that key's AuthKey_<id>.p8
#     APPLE_TEAM_ID                  (shared with the Mac app above)
#     MICROSOFT_CLIENT_ID            (shared with the Mac app above; the registration needs the iOS redirect)
#   Variables (Settings → Secrets and variables → Actions → Variables; not secret):
#     IOS_BUNDLE_ID                  e.g. com.yourname.cadence
#     GOOGLE_IOS_CLIENT_PREFIX       the part of the iOS OAuth client ID before .apps.googleusercontent.com
#     SPOTIFY_CLIENT_ID              optional built-in Spotify app
# Build numbers are the run number followed by the attempt (run 42 → 421, its re-run → 422), so a
# re-run never reuses a number App Store Connect has already seen.
#
# Releasing a PR (the "pr" input): the "source" job merges that PR into main first (merge commit, the same
# as the Merge button) and the whole release builds from the merge commit. A PR that conflicts with main,
# isn't open against main, or that GitHub refuses to merge (branch protection, failing required checks)
# fails the run before anything is built. Its version is the usual bump from the last release tag, with the
# PR's own label counted. The GitHub release is always a draft (so the website isn't updated), and
# TestFlight's "What to Test" opens with the PR's number and title, then every iPhone change since the
# last major release (the newest vX.0.0 tag; all of them while still on 0.x). A dry run with a PR merges
# nothing: it checks the PR merges cleanly and builds GitHub's test merge (refs/pull/<n>/merge).
# Re-running after the merge went through picks up the existing merge commit instead of failing.
# Merges made with the workflow's token don't start other workflows, so CI won't run on main for it.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge into main and release as a draft (blank = release main as it is)"
        type: string
        default: ""
      bump:
        description: "Version bump. auto = highest major/minor/patch label on PRs merged since the last release"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: false
      dry_run:
        description: "Build everything but don't tag or release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Xcode every macOS job builds with, pinned so it doesn't drift with the runner image's default
# (scripts/ci-select-xcode.sh fails if it isn't installed). Matches local development (Xcode 27).
# The xcode-27 runner label (macOS 27, Apple Silicon) is GitHub's GA image carrying Xcode 27.
env:
  XCODE_VERSION: "27.2"

permissions:
  contents: read

jobs:
  # What the release builds from. Without a PR: the commit this run is on. With one: merges it into main
  # (or, on a dry run, only checks it would merge) and hands on the resulting commit. Always runs, so the
  # jobs after it never get skipped for want of it.
  source:
    name: ${{ inputs.pr != '' && format('Merge PR {0} into main', inputs.pr) || 'Pick commit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # merging the PR
      pull-requests: write
    outputs:
      ref: ${{ steps.pr.outputs.ref || github.sha }}     # what the jobs below check out
      sha: ${{ steps.pr.outputs.sha || github.sha }}     # what the release tag points at
      pr_number: ${{ steps.pr.outputs.number }}
      pr_title: ${{ steps.pr.outputs.title }}
    steps:
      - name: Releases come from main
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "::error::Run the release from main (this run is on ${{ github.ref_name }}). Use dry_run to test other branches."
          exit 1

      - name: Merge the PR
        id: pr
        if: ${{ inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::'$PR' isn't a PR number"; exit 1; }
          info() { gh pr view "$PR" --json number,title,state,baseRefName,headRefOid,mergeable,isDraft,mergeCommit; }
          JSON="$(info)"
          STATE="$(jq -r .state <<<"$JSON")"
          BASE="$(jq -r .baseRefName <<<"$JSON")"
          TITLE="$(jq -r .title <<<"$JSON")"
          [[ "$BASE" == "main" ]] || { echo "::error::PR #$PR targets $BASE, not main"; exit 1; }

          case "$STATE" in
            MERGED)
              # A re-run after the merge went through: release the merge commit that's already there.
              SHA="$(jq -r .mergeCommit.oid <<<"$JSON")"
              echo "::notice::PR #$PR is already merged ($SHA) — releasing that merge commit."
              ;;
            OPEN)
              [[ "$(jq -r .isDraft <<<"$JSON")" == "false" ]] || { echo "::error::PR #$PR is a draft"; exit 1; }
              # GitHub works out mergeability in the background: UNKNOWN until it has.
              for _ in $(seq 1 24); do
                MERGEABLE="$(jq -r .mergeable <<<"$JSON")"
                [[ "$MERGEABLE" != "UNKNOWN" ]] && break
                sleep 5; JSON="$(info)"
              done
              case "$MERGEABLE" in
                MERGEABLE) ;;
                CONFLICTING) echo "::error::PR #$PR conflicts with main. Resolve the conflicts, then run the release again."; exit 1 ;;
                *) echo "::error::GitHub couldn't tell whether PR #$PR merges cleanly (mergeable: $MERGEABLE). Try again."; exit 1 ;;
              esac
              if [[ "$DRY_RUN" == "true" ]]; then
                # Build GitHub's test merge of the PR into main, without merging anything.
                SHA="$(gh api "repos/$GH_REPO/pulls/$PR" --jq .merge_commit_sha)"
                REF="refs/pull/$PR/merge"
                echo "::notice::Dry run: PR #$PR merges cleanly; building its test merge without merging."
              else
                # --match-head-commit: refuse if someone pushed to the PR after the check above.
                gh pr merge "$PR" --merge --match-head-commit "$(jq -r .headRefOid <<<"$JSON")"
                for _ in $(seq 1 12); do
                  SHA="$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty')"
                  [[ -n "$SHA" ]] && break
                  sleep 5
                done
                [[ -n "$SHA" ]] || { echo "::error::PR #$PR merged, but its merge commit didn't show up"; exit 1; }
              fi
              ;;
            *) echo "::error::PR #$PR is $STATE"; exit 1 ;;
          esac

          {
            echo "number=$PR"
            echo "sha=$SHA"
            echo "ref=${REF:-$SHA}"
            # Titles are one line, but use a delimiter anyway so any character is safe.
            echo "title<<TITLE_EOF_$$"; echo "$TITLE"; echo "TITLE_EOF_$$"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### PR #$PR: $TITLE"
            if [[ "$DRY_RUN" == "true" ]]; then echo "- Dry run: merges cleanly, not merged"; else echo "- Merged into main as \`$SHA\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Work out version
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      bump: ${{ steps.next.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          # Count the PR's label even if GitHub's search hasn't indexed the merge yet (or, on a dry run, it isn't merged).
          INCLUDE_PR: ${{ needs.source.outputs.pr_number }}
        run: scripts/next-version.sh "${{ inputs.bump }}"
      - name: Summary
        run: |
          {
            echo "### Releasing ${{ steps.next.outputs.tag }}"
            echo "- Bump: **${{ steps.next.outputs.bump }}** from ${{ steps.next.outputs.previous_tag || 'nothing (first release)' }}"
            echo "- PRs merged since then: ${{ steps.next.outputs.prs }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit tests
    needs: [source, version]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh
      - run: scripts/test.sh

  build:
    name: Build app and DMG
    needs: [source, version, test]
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}     # scripts/build.sh stamps these into Info.plist
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.CODESIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build Cadence.app
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.CODESIGN_IDENTITY || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
        run: |
          if [[ "$HAS_SIGNING" != "true" ]]; then
            echo "::warning::No signing secrets — building ad-hoc signed. The DMG will not open cleanly on other Macs."
          fi
          scripts/build.sh
          codesign --verify --deep --strict --verbose=2 build/Cadence.app

      - name: Notarize app
        id: notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Notarize the app itself so the zip download is stapled too, then the DMG below.
          ditto -c -k --keepParent build/Cadence.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple build/Cadence.app
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Notarization skipped
        if: steps.notarize.outcome != 'success'
        run: echo "::warning::Notarization skipped — add the Developer ID and notary secrets to enable it. The release will be a pre-release."

      - name: Package DMG and zip
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.CODESIGN_IDENTITY || '' }}
        run: |
          scripts/dmg.sh "$VERSION"
          ditto -c -k --keepParent build/Cadence.app "build/Cadence-$VERSION.zip"

      - name: Notarize DMG
        if: steps.notarize.outcome == 'success'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="build/Cadence-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Collect artefacts
        run: |
          mkdir -p dist
          mv "build/Cadence-$VERSION.dmg" "build/Cadence-$VERSION.zip" dist/
          (cd dist && shasum -a 256 Cadence-* | tee SHA256SUMS.txt)
          # Same DMG under a fixed name, so .../releases/latest/download/Cadence.dmg
          # always fetches the newest notarized build.
          cp "dist/Cadence-$VERSION.dmg" dist/Cadence.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  ios:
    name: iPhone app to TestFlight
    needs: [source, version, test]
    # Off until the iPhone app is set up for distribution (see above).
    if: ${{ vars.IOS_BUNDLE_ID != '' }}
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read   # scripts/changelog.py lists the merged PRs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
      HAS_IOS_SIGNING: ${{ secrets.IOS_DISTRIBUTION_P12 != '' && secrets.IOS_APP_PROFILE != '' && secrets.IOS_WIDGET_PROFILE != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' && vars.IOS_BUNDLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0   # the changelog needs the tags
      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      # What changed in the iPhone app (only PRs labelled ios): since the last release, or for a PR release,
      # the PR's number and title then everything since the last major release (newest vX.0.0 tag; on 0.x, all).
      - name: iPhone changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREV_TAG: ${{ needs.version.outputs.previous_tag }}
          PR_NUMBER: ${{ needs.source.outputs.pr_number }}
          PR_TITLE: ${{ needs.source.outputs.pr_title }}
        run: |
          NOTES="$RUNNER_TEMP/ios-notes.txt"
          if [[ -z "$PR_NUMBER" ]]; then
            python3 -I scripts/changelog.py "$TAG" "$PREV_TAG" --target-ref HEAD --only ios --format text > "$NOTES"
            [[ -s "$NOTES" ]] || echo "Behind-the-scenes changes only." > "$NOTES"
          else
            MAJOR_TAG="$(git tag --list 'v[0-9]*.0.0' --sort=-v:refname | grep -E '^v[0-9]+\.0\.0$' | grep -vxF "$TAG" | head -n1 || true)"
            CHANGES="$(python3 -I scripts/changelog.py "$TAG" "$MAJOR_TAG" --target-ref HEAD --only ios --format text)"
            {
              echo "PR #$PR_NUMBER: $PR_TITLE"
              echo
              echo "Changes since ${MAJOR_TAG:-the first release}:"
              echo "${CHANGES:-Behind-the-scenes changes only.}"
            } > "$NOTES"
          fi
          {
            echo "### iPhone changelog for $VERSION"
            echo '```text'; cat "$RUNNER_TEMP/ios-notes.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-iOS-${{ needs.version.outputs.version }}-notes
          path: ${{ runner.temp }}/ios-notes.txt

      - name: No signing secrets
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          echo "::warning::iPhone app not uploaded — add the iOS signing and App Store Connect secrets (see the top of release.yml). Building for the Simulator only."
          scripts/ios-build.sh

      - name: Import distribution certificate
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/ios-cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/ios-cert.p12"

      - name: Install provisioning profiles
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE }}
        run: |
          # Xcode 16+ reads UserData; older tools read MobileDevice. Install into both.
          DIRS=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles")
          mkdir -p "${DIRS[@]}"
          install_profile() { # $1 base64, $2 env var for its name
            local file="$RUNNER_TEMP/$2.mobileprovision"
            echo "$1" | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$2.plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/$2.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/$2.plist")
            for d in "${DIRS[@]}"; do cp "$file" "$d/$uuid.mobileprovision"; done
            echo "$2=$name" >> "$GITHUB_ENV"
            echo "Installed $2: $name ($uuid)"
          }
          install_profile "$APP_PROFILE" APP_PROFILE_NAME
          install_profile "$WIDGET_PROFILE" WIDGET_PROFILE_NAME

      - name: Write build settings
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          GOOGLE_IOS_CLIENT_PREFIX: ${{ vars.GOOGLE_IOS_CLIENT_PREFIX }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          # A release without built-in sign-in would make users bring their own OAuth clients.
          [[ -n "$GOOGLE_IOS_CLIENT_PREFIX" ]] || echo "::warning::GOOGLE_IOS_CLIENT_PREFIX isn't set: Sign in with Google will be off."
          [[ -n "$MICROSOFT_CLIENT_ID" ]] || echo "::warning::MICROSOFT_CLIENT_ID isn't set: Sign in with Microsoft will be off."
          cat > iOS/Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = $TEAM_ID
          CADENCE_BUNDLE_ID = $BUNDLE_ID
          GOOGLE_IOS_CLIENT_PREFIX = $GOOGLE_IOS_CLIENT_PREFIX
          MICROSOFT_CLIENT_ID = $MICROSOFT_CLIENT_ID
          SPOTIFY_CLIENT_ID = $SPOTIFY_CLIENT_ID
          CADENCE_APP_PROFILE = $APP_PROFILE_NAME
          CADENCE_WIDGET_PROFILE = $WIDGET_PROFILE_NAME
          EOF

      - name: Archive
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          xcodebuild -project iOS/CadenceCompanion.xcodeproj -scheme Cadence -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cadence.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      # Prebuilt frameworks (Spotify's SpotifyiOS.xcframework) ship without dSYMs, so the export's symbol
      # upload warns "The archive did not include a dSYM for the SpotifyiOS.framework". Give each embedded
      # framework that lacks one a dSYM made with dsymutil: no DWARF in it (the vendor stripped that), but its
      # UUID matches, which satisfies the upload and lets crash reports name the framework's exported symbols.
      - name: Add missing framework dSYMs
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          ARCHIVE="$RUNNER_TEMP/Cadence.xcarchive"
          mkdir -p "$ARCHIVE/dSYMs"
          for fw in "$ARCHIVE/Products/Applications/"*.app/Frameworks/*.framework; do
            [[ -d "$fw" ]] || continue
            name="$(basename "$fw" .framework)"
            dsym="$ARCHIVE/dSYMs/$name.framework.dSYM"
            [[ -e "$dsym" ]] && continue
            xcrun dsymutil "$fw/$name" -o "$dsym" 2>&1 | grep -v "no debug symbols" || true
            echo "Made $(basename "$dsym"): $(dwarfdump --uuid "$dsym" | awk '{print $2}' | paste -sd, -)"
          done

      - name: Export and upload to TestFlight
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Dry runs export the .ipa (kept as an artifact below) instead of uploading it.
          DESTINATION=upload
          [[ "$DRY_RUN" == "true" ]] && DESTINATION=export
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string $DESTINATION" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Apple Distribution" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$BUNDLE_ID string $APP_PROFILE_NAME" \
            -c "Add :provisioningProfiles:$BUNDLE_ID.widgets string $WIDGET_PROFILE_NAME" \
            "$OPTS"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cadence.xcarchive" \
            -exportOptionsPlist "$OPTS" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
          if [[ "$DESTINATION" == "upload" ]]; then
            echo "### iPhone app $VERSION ($BUILD_NUMBER) uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
            echo "Processing takes a few minutes; then it's under TestFlight in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          fi

      # TestFlight's "What to Test" gets the iPhone changelog. Not fatal: the build is up either way, and the
      # notes are in the run's artifacts to paste by hand.
      - name: Set TestFlight notes
        if: env.HAS_IOS_SIGNING == 'true' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: 35
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          python3 -I scripts/testflight-notes.py "$BUNDLE_ID" "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/ios-notes.txt"

      - uses: actions/upload-artifact@v4
        if: env.HAS_IOS_SIGNING == 'true' && inputs.dry_run
        with:
          name: Cadence-iOS-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Clean up
        if: always() && env.HAS_IOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -f iOS/Config/Local.xcconfig "$RUNNER_TEMP"/AuthKey_*.p8

  release:
    name: Tag and publish release
    needs: [source, version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read   # scripts/changelog.py lists the merged PRs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREV_TAG: ${{ needs.version.outputs.previous_tag }}
      BUMP: ${{ needs.version.outputs.bump }}
      NOTARIZED: ${{ needs.build.outputs.notarized }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      DRAFT: ${{ inputs.draft || inputs.pr != '' }}   # a PR release is always a draft
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0   # the changelog needs the tags

      - uses: actions/download-artifact@v4
        with:
          name: Cadence-${{ needs.version.outputs.version }}
          path: dist

      # Tag only after the build succeeded, so a failed run never leaves a stray tag behind.
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Cadence $VERSION" "$SOURCE_SHA"
          git push origin "$TAG"

      - name: Write release notes
        run: scripts/release-notes.sh "$TAG" "$PREV_TAG" "$BUMP" "$NOTARIZED" dist/SHA256SUMS.txt > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        run: |
          FLAGS=(--verify-tag --title "Cadence $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$DRAFT" == "true" ]] && FLAGS+=(--draft)
          # Un-notarized builds are pre-releases so they never show up as "Latest".
          if [[ "$NOTARIZED" == "true" ]]; then FLAGS+=(--latest); else FLAGS+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* "${FLAGS[@]}"
          {
            echo "### Released $TAG"
            gh release view "$TAG" --json url --jq '"- " + .url'
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Update website downloads
    needs: release
    # Drafts (which PR releases always are) aren't public, so the site would have nothing new to show.
    if: ${{ !inputs.dry_run && !inputs.draft && inputs.pr == '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/site-downloads.yml
