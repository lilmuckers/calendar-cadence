name: PR labels

# Every PR needs exactly one release label: major, minor or patch.
# The release workflow reads these to decide the next version, and the release notes group changes by them.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  pull-requests: read

jobs:
  semver-label:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of major / minor / patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          found=$(jq -r '[.[] | select(. == "major" or . == "minor" or . == "patch")] | join(", ")' <<<"$LABELS")
          count=$(jq '[.[] | select(. == "major" or . == "minor" or . == "patch")] | length' <<<"$LABELS")
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Add exactly one release label (major, minor or patch). Found: ${found:-none}"
            exit 1
          fi
          echo "Release label: $found"
