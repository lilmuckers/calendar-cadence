# Categories for GitHub's "Generate release notes" button, for releases made by hand.
# The Release workflow writes its own changelog, grouped by build too (scripts/changelog.py).
# Each merged PR lands in the first category whose label it has.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: 💥 Breaking changes
      labels: [major]
    - title: ✨ New features
      labels: [minor]
    - title: 🐛 Fixes and improvements
      labels: [patch]
    - title: 📦 Other changes
      labels: ["*"]
