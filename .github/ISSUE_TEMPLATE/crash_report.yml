name: 💥 Crash report
description: Cadence crashed. Usually opened from the "Cadence crashed" window, with the details filled in.
title: "Crash: "
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The crash details below come from your Mac. Cadence swaps your home folder for `~`,
        but please check for anything private (meeting titles, attendees, links) before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing when it crashed?
      description: Optional, but it helps a lot. Clicking something, waking the Mac, joining a meeting, changing a setting…
      placeholder: I'd just woken the Mac and the countdown panel was moving to the other display.

  - type: textarea
    id: crash-log
    attributes:
      label: Crash details
      description: Filled in by Cadence. If you're writing this by hand, find the Cadence report in Console.app → Crash Reports.
      render: text
    validations:
      required: true

  - type: input
    id: cadence-version
    attributes:
      label: Cadence version
      placeholder: 0.5.4
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - First time
        - Now and then
        - Often
        - Every time I open Cadence
